<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubbistix | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="https://bubbistix-storage.s3.ap-southeast-1.amazonaws.com/assets/fav-smile.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../js/registration.js"></script>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <input id="nav-toggle" type="checkbox" aria-label="Toggle navigation menu"> 
            <div class="logo-and-toggler-wrapper d-flex justify-content-between align-items-center w-100 p-2 p-lg-0">
                <a class="navbar-brand" href="../../index.html">
                    <img src="https://bubbistix-storage.s3.ap-southeast-1.amazonaws.com/assets/bubbistix.png" alt="BUBBiSTiX logo" class="logo">
                </a>
                <div class="pure-css-hamburger d-lg-none">
                    <label for="nav-toggle" class="hamburger" role="button">
                        <div class="top-bun"></div>
                        <div class="meat"></div>
                        <div class="bottom-bun"></div>
                    </label>
                </div>
            </div> 
            <div class="collapse navbar-collapse justify-content-lg-center" id="navbarNav">
                <ul class="navbar-nav nav-links mb-2 mb-lg-0">
                    <li class="nav-item"><a href="../../index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">About Us</a></li>
                    <li class="nav-item"><a href="shop.html" class="nav-link">Stickers</a></li>
                    <li class="nav-item"><a href="faqs.html" class="nav-link">FAQs</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                    <li class="nav-item">
                        <a href="registration.html" class="nav-link active" aria-current="page">
                            <img src="https://bubbistix-storage.s3.ap-southeast-1.amazonaws.com/assets/account-icon.png" alt="Account icon" class="nav-icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="add-to-cart.html" class="nav-link">
                            <img src="https://bubbistix-storage.s3.ap-southeast-1.amazonaws.com/assets/add-to-cart-icon.png" alt="Shopping cart icon" class="nav-icon">
                        </a>
                    </li>
                </ul> 
            </div>
        </div>
    </nav>
</header>

<main class="registration-main">
  <div class="login-container">
    <h1 class="login-title">Log In</h1>
    
    <div id="resetMessage" class="reset-success-message hidden">
      <p>We've sent you an email with a link to update your password.</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="input-group">
        <input type="email" id="email" name="email" placeholder="Email" required>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class="fa-solid fa-eye" id="togglePassword"></i>
      </div>

      <div class="forgot-password-wrapper" style="text-align: right; margin-top: -0.5rem;">
        <a href="../html/reset-password.html" class="forgot-link">Forgot your password?</a>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <div class="or-divider">
        <span>or</span>
      </div>

      <div id="g_id_onload"
          data-client_id="1014156299805-lvum203bnbqf5b2l3ekd8res5itn8r6e.apps.googleusercontent.com"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false">
      </div>

      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="continue_with" data-shape="pill" data-logo_alignment="left"></div>

      <div class="auth-footer-text">
        <p>Don't have an account yet? <a href="../html/create-account.html">Sign Up</a></p>
      </div>
    </form>
  </div>
</main>

<footer>
  <div class="footer-container">
    <div class="footer-nav">
      <ul>
        <li><a href="../../index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="shop.html">Stickers</a></li>
        <li><a href="faqs.html">FAQs</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    <div class="footer-copy">
      <p>Copyright © Bubbistix 2025</p>
    </div>
  </div>
</footer>

<script src="../js/validation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/ui_bootstrap.js"></script>
</body>
</html>
